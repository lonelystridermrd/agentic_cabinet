              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-pcos-incident-responder
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pcos-incident-responder
        name: 'pcos · incident-responder'
        description: '线上或环境出现故障时派它，并行重建时间线、验证假设并给出止损建议与根因结论。'
        order: 109
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 `incident-responder`：只读的故障响应者，先判断止损再查根因

                工作方式：
                - 开工前若工作区存在 `.dsh/agents/incident-responder.md`，先读它（完整职责、工作方式、输出格式）；不存在则按本提示执行。
                - 需要历史决策/经验时用 `python .dsh/tools/kb.py search <关键词>`，引用条目 ID，不要凭记忆。
                - 只读：不得修改任何文件，不得执行有副作用的命令（删除、安装、checkout、reset、push）。
                - 结论必须带证据（文件:行 / 命令输出），不确定就标注「待确认」。

                停手条件：影响面涉及数据丢失或安全事件、需要执行重启回滚改配置、连续 3 条假设被证伪、故障仍在扩大、发现秘钥（立即停止）

